<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Don’t click me</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      cursor: pointer;
      overflow: hidden;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      display: none;
    }
    .warning {
      color: red;
      font-family: Arial, sans-serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="warning">Don’t click me</div>
  <video id="vid" src="video.mp4" loop playsinline></video>

  <script>
    const video = document.getElementById('vid');
    const warning = document.querySelector('.warning');

    function fadeInAudio() {
      video.muted = false;
      video.volume = 0;
      video.play();

      let vol = 0;
      const fade = setInterval(() => {
        vol += 0.02;
        if (vol >= 1) {
          vol = 1;
          clearInterval(fade);
        }
        video.volume = vol;
      }, 100);
    }

    document.body.addEventListener('click', () => {
      warning.style.display = 'none';
      video.style.display = 'block';
      fadeInAudio();
    }, { once: true });
  </script>
</body>
</html>
